version: 2

updates:
  - package-ecosystem: pip
    directories:
      - "/anonymizer_module"
      - "/collector_module"
      - "/corrector_module"
      - "/opendata_module"
      - "/opendata_collector_module"
      - "/reports_module"
    schedule:
        interval: "weekly"
        day: "thursday"
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      python-major:
        applies-to: version-updates
        update-types:
          - "major"
    ignore: # ignoring the following packages as they require python >= 3.11
      - dependency-name: "pandas"
        versions:
            - ">=3.0.0"
      - dependency-name: "numpy"
        versions:
          - ">=2.3.0"
      - dependency-name: "scipy"
        versions:
            - ">=1.16.0"
      # Stay on Django 5.2 LTS (latest LTS, Next LTS is 6.2)
      - dependency-name: "django"
        versions:
            - ">=6.0.0"

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "thursday"
    groups:
      actions-update:
        applies-to: version-updates
        patterns:
          - "*"
