name: metrics-e2e-mock-xroad
services:
  cs:
    image: wiremock/wiremock:3x-alpine
    container_name: xroad-metrics-e2e-cs
    ports:
      - "80:8080"
    volumes:
      - ./mock-xroad/cs/mappings:/home/wiremock/mappings:ro
      - ./mock-xroad/cs/__files:/home/wiremock/__files:ro
    networks:
      - metrics-e2e-mock-xroad-network
    command: ["--verbose"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  ss0:
    image: wiremock/wiremock:3x-alpine
    container_name: xroad-metrics-e2e-ss0
    ports:
      - "4210:8080"
    volumes:
      - ./mock-xroad/ss0/mappings:/home/wiremock/mappings:ro
      - ./mock-xroad/ss0/__files:/home/wiremock/__files:ro
    networks:
      - metrics-e2e-mock-xroad-network
    command: ["--verbose"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  metrics-e2e-mock-xroad-network:
    driver: bridge